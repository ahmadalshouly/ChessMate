name: EAS simulator build
# Builds the app for iOS Simulator / Android emulator on EAS so it can be
# opened in Expo's cloud simulators (eas simulator --build-id <id>).
# Run it manually, or add the "simulator-build" label to a pull request.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        options: [all, ios, android]
        default: all
  pull_request:
    types: [labeled, synchronize]

concurrency:
  group: eas-simulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'simulator-build')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/app
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - name: Check token
        run: test -n "$EXPO_TOKEN" || (echo "::error::EXPO_TOKEN secret is missing" && exit 1)
      - name: Link EAS project
        run: npx eas-cli@latest init --non-interactive --force
      - name: Show project id
        run: |
          ID=$(node -p "require('./app.json').expo.extra?.eas?.projectId ?? ''")
          echo "EAS project id: $ID"
          echo "EAS project id: \`$ID\` (commit it to apps/app/app.json under expo.extra.eas.projectId)" >> "$GITHUB_STEP_SUMMARY"
      - name: Build
        run: |
          npx eas-cli@latest build --profile simulator --platform "${{ inputs.platform || 'all' }}" --non-interactive --no-wait --json > builds.json
          cat builds.json
          node -e "for (const b of require('./builds.json')) console.log('- ' + b.platform + ': https://expo.dev/accounts/' + b.project.ownerAccount.name + '/projects/' + b.project.slug + '/builds/' + b.id)" >> "$GITHUB_STEP_SUMMARY"
