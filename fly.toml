# fly.toml app configuration file generated for chessmate on 2026-11-26T21:08:21Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'chessmate'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[deploy]
  strategy = 'immediate'

[env]
  ENGINE_WORKERS = '1'
  NODE_ENV = 'production'
  PORT = '8787'
  STOCKFISH_PATH = '/usr/games/stockfish'
  TRUST_PROXY = 'fly'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 5000
    soft_limit = 2000

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
